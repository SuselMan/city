<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Тиходол · спрайты</title><style>body{margin:24px;background:#737b38;color:#fff7dc;font:15px system-ui}a{color:#fff7dc}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:14px}.card{border:1px solid #ffffff35;padding:10px;background:#607031;border-radius:9px;text-align:center}.sprite{width:140px;max-width:100%;margin:10px auto;background-repeat:no-repeat}h1{font:30px Georgia}small{display:block;opacity:.7;font-size:10px}select{padding:10px;margin:12px 0;font:inherit}</style><h1>Общая камера зданий</h1><p>Ориентир: ортографический вид сверху и спереди, 15° от вертикали, параллельные края. Все текущие уровни и ветки.</p><a href="./">← Игра</a> · <a href="progression.html">Модель города</a><br><select id="filter"><option>Все</option><option>Дома</option><option>Ратуши</option><option>Башни</option><option>Службы и производства</option></select><div id="grid" class="grid"></div><script>fetch('art-catalog.json').then(r=>r.json()).then(items=>{function draw(){const filter=document.getElementById('filter').value,grid=document.getElementById('grid');grid.replaceChildren();for(const item of items.filter(i=>filter==='Все'||i.group===filter)){const card=document.createElement('div');card.className='card';const sprite=document.createElement('div');sprite.className='sprite';sprite.style.height='140px';const canvas=document.createElement('canvas');canvas.width=280;canvas.height=280;canvas.style.width='140px';canvas.style.height='140px';const image=new Image();image.onload=()=>{const r=item.cut,scale=Math.min(260/r.width,260/r.height),w=r.width*scale,h=r.height*scale;canvas.getContext('2d').drawImage(image,r.x,r.y,r.width,r.height,(280-w)/2,(280-h)/2,w,h);};image.src='assets/'+item.file;sprite.append(canvas);const title=document.createElement('div');title.textContent=item.name;const file=document.createElement('small');file.textContent=item.file;card.append(sprite,title,file);grid.append(card);}}document.getElementById('filter').onchange=draw;draw();});</script></html>
