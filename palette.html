<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Палитра Тиходола</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f3e9;color:#293d32;font:15px system-ui}main{max-width:1120px;margin:auto;padding:25px}a{color:#416b53}h1{font:34px Georgia;margin:20px 0 10px}p{line-height:1.6;color:#69735f}h2{font:23px Georgia}.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}button,input{font:inherit;border:1px solid #d5d7c6;border-radius:8px;background:#fcfbf5;color:#293d32;padding:9px}button{cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}.card{background:#fcfbf5;border-radius:12px;overflow:hidden;border:1px solid #dedfd0}.swatch{height:96px;position:relative}.swatch input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}.body{padding:12px}.body strong{display:block;margin-bottom:9px}.body input{width:110px;text-transform:lowercase}.body p{font-size:12px;min-height:36px;margin-bottom:0}.preview{margin:20px 0;border-radius:14px;overflow:hidden;border:1px solid #dedfd0}.preview canvas{display:block;width:100%;height:auto}#status{min-height:25px;font-size:13px}.references{display:flex;gap:12px;flex-wrap:wrap}.references img{width:210px;max-height:160px;object-fit:cover;border-radius:9px}@media(max-width:600px){main{padding:16px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.swatch{height:78px}h1{font-size:29px}}
</style>
<main><a href="./">← Игра</a> · <a href="progression.html">Модель</a> · <a href="review-map.html">Карта спрайтов по номерам</a><h1>Палитра Тиходола</h1><p>Нажми цвет, чтобы изменить его. Ниже — текущие спрайты на выбранном фоне травы. Сохранённый вариант остаётся в этом браузере; JSON можно скачать для обновления общей палитры проекта.</p><canvas id="strip" width="1088" height="96" style="display:block;width:100%;height:96px;margin:18px 0;cursor:pointer" aria-label="Все цвета палитры рядом без промежутков"></canvas><div class="toolbar"><button id="save">Сохранить вариант</button><button id="export">Скачать палитру</button><button id="export-strip">Скачать полосу PNG</button><button id="reset">Исходные цвета</button></div><div id="status" role="status"></div><div class="preview"><canvas id="preview" width="1000" height="300"></canvas></div><div id="groups"></div><h2>Первоначальные примеры</h2><div class="references"><a href="docs/references/style-world.jpg"><img src="docs/references/style-world.jpg" alt="Первоначальный пример мира"></a><a href="docs/references/style-trees.jpg"><img src="docs/references/style-trees.jpg" alt="Первоначальный пример деревьев"></a></div></main>
<script>
'use strict';
(async()=>{const original=await fetch('assets/palette.json').then(r=>r.json()),key='hearthvale-palette-draft';let draft=structuredClone(original);try{const saved=JSON.parse(localStorage.getItem(key)||'null');if(saved?.colors?.length===original.colors.length&&saved.colors.every(c=>/^#[0-9a-f]{6}$/i.test(c.hex)))draft=saved;}catch{}const canvas=document.getElementById('preview'),ctx=canvas.getContext('2d'),images=[];const natural=await fetch('assets/natural-art-frames-v1.json').then(r=>r.json()),buildings=await fetch('assets/art-frames-v1.json').then(r=>r.json());for(const[file,frames,ids]of [['trees-v4.webp',natural.forest,[0,1,4,5]],['rocks-v7.webp',natural.rocks,[0,4]],['houses-v5.webp',buildings.houses,[0,2]]]){const image=new Image();image.src='assets/'+file;await image.decode();for(const i of ids)images.push({image,rect:frames[i]});}
const color=id=>draft.colors.find(c=>c.id===id).hex;function preview(){const strip=document.getElementById('strip'),sc=strip.getContext('2d');draft.colors.forEach((c,i)=>{sc.fillStyle=c.hex;sc.fillRect(i*64,0,64,96);});ctx.fillStyle=color('grass');ctx.fillRect(0,0,1000,300);ctx.fillStyle=color('sand');ctx.fillRect(0,235,1000,65);ctx.fillStyle=color('water');ctx.fillRect(0,265,1000,35);images.forEach(({image,rect:r},i)=>{const scale=112/Math.max(r.width,r.height),w=r.width*scale,h=r.height*scale;ctx.drawImage(image,r.x,r.y,r.width,r.height,60+i*120-w/2,220-h,w,h);});}function render(){const root=document.getElementById('groups');root.replaceChildren();for(const group of [...new Set(draft.colors.map(c=>c.group))]){const title=document.createElement('h2');title.textContent=group;root.append(title);const grid=document.createElement('div');grid.className='grid';root.append(grid);for(const c of draft.colors.filter(c=>c.group===group)){const card=document.createElement('div');card.className='card';const swatch=document.createElement('div');swatch.className='swatch';swatch.style.background=c.hex;const picker=document.createElement('input');picker.type='color';picker.value=c.hex;picker.setAttribute('aria-label',c.name);swatch.append(picker);const body=document.createElement('div');body.className='body';const name=document.createElement('strong');name.textContent=c.name;const hex=document.createElement('input');hex.value=c.hex;hex.setAttribute('aria-label','HEX '+c.name);hex.maxLength=7;const text=document.createElement('p');text.textContent=c.use;const update=value=>{if(!/^#[0-9a-f]{6}$/i.test(value))return;c.hex=value.toLowerCase();picker.value=c.hex;hex.value=c.hex;swatch.style.background=c.hex;document.getElementById('status').textContent='Вариант изменён. Можно сохранить или скачать.';preview();};picker.oninput=()=>update(picker.value);hex.onchange=()=>update(hex.value);body.append(name,hex,text);card.append(swatch,body);grid.append(card);}}preview();}document.getElementById('strip').onclick=e=>{const r=e.target.getBoundingClientRect(),i=Math.min(draft.colors.length-1,Math.floor((e.clientX-r.x)/r.width*draft.colors.length));document.querySelectorAll('.card input[type=color]')[i].click();};document.getElementById('export-strip').onclick=()=>{const a=document.createElement('a');a.href=document.getElementById('strip').toDataURL('image/png');a.download='hearthvale-palette-strip.png';a.click();};document.getElementById('save').onclick=()=>{localStorage.setItem(key,JSON.stringify(draft));document.getElementById('status').textContent='Вариант палитры сохранён в этом браузере.';};document.getElementById('reset').onclick=()=>{draft=structuredClone(original);localStorage.removeItem(key);render();document.getElementById('status').textContent='Возвращены исходные цвета.';};document.getElementById('export').onclick=()=>{const blob=new Blob([JSON.stringify(draft,null,2)+'\n'],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='hearthvale-palette.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};render();})().catch(()=>{document.getElementById('status').textContent='Не удалось загрузить палитру. Обнови страницу.';});
</script></html>
