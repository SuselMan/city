<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Тиходол — модель города</title><link rel="stylesheet" href="resource-icons.css"><style>
*{box-sizing:border-box}body{margin:0;background:#f3f0e5;color:#343e30;font:16px system-ui}header{padding:24px 5%;background:#faf9f2;border-bottom:1px solid #ddd7c5}h1{margin:0;font:32px Georgia}p{line-height:1.5}button,select{font:inherit;border:1px solid #c9ccb9;background:#fffdf6;color:inherit;border-radius:9px;padding:10px;cursor:pointer}nav{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}main{padding:24px 5%}.board{display:grid;grid-template-columns:repeat(4,minmax(230px,1fr));gap:20px;overflow:auto;padding:10px 0 24px}.tier{border-top:4px solid #4e7563;padding-top:14px}.node{display:block;text-align:left;width:100%;margin:12px 0;padding:16px;min-height:100px;box-shadow:0 3px 8px #403b2510}.node b{display:block;font:20px Georgia;margin-bottom:8px}.node small{display:block;color:#67745e;line-height:1.5}.node.active{outline:3px solid #bb913e}.node.related{background:#e6ecda}.resources{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}.chain{background:#fffdf6;border-radius:10px;padding:18px;margin:12px 0}.details{background:#fffdf6;padding:22px;border-radius:12px;max-width:850px}textarea{width:100%;min-height:130px;margin:12px 0;padding:12px;font:inherit;border:1px solid #ccc8b4;border-radius:8px}.hint{font-size:14px;color:#68715d}a{color:#456e5c}#notice{min-height:24px}@media(max-width:700px){header,main{padding:20px}.board{grid-template-columns:repeat(4,240px)}}
</style><header><h1>Модель Тиходола</h1><p>От ратуши до производства и обороны. Нажми узел: увидишь зависимости и сможешь записать идею.</p><a href="./">← Вернуться в игру</a><nav><button data-view="development">Развитие</button><button data-view="production">Ресурсы и производство</button><button id="export">Скачать модель и заметки</button></nav><p class="hint">Правила ниже действуют в игре. Заметки сохраняются только в этом браузере и не меняют игровой баланс.</p></header><main><section id="development"><div id="board" class="board"></div></section><section id="production" hidden><div id="goods" class="resources"></div><div id="chains"></div></section><aside class="details"><h2 id="title">Выбери узел</h2><p id="description">Связанные узлы подсветятся на схеме.</p><label for="notes">Идеи, вопросы и изменения баланса</label><textarea id="notes" disabled placeholder="Например: для улучшения ратуши нужны довольные жители, а не только монеты…"></textarea><p id="notice" class="hint"></p></aside></main><script src="sim.js?v=28"></script><script src="resource-icons.js"></script><script>
const {TYPES,GOODS,PROGRESSION}=TownSim,nodes=[],levels=['Поселение','Город','Торговый город','Столица'];for(let l=1;l<=4;l++){nodes.push({id:'hall'+l,level:l,name:'Ратуша '+l,requires:l>1?['hall'+(l-1)]:[],description:l===1?'Стартовый уровень. Дома, вода, еда, дороги, лесорубы, базовая оборона и пожарные.':'Улучшение стоит '+PROGRESSION.hallCosts[l-1]+' монет. Открывает башни уровня '+l+'. Прочность +250.'});nodes.push({id:'tower'+l,level:l,name:'Башня '+l,requires:l>1?['hall'+l,'tower'+(l-1)]:['hall1'],description:l===1?'Базовая стрелковая башня, 2 работника.':'Гарнизон '+l*2+' работников. '+(l===2?'Ветки: стрелковая, взрывная, аура.':l===3?'Специализации каждой ветки.':'Усиление выбранной специализации.')});nodes.push({id:'warehouse'+l,level:l,name:'Склад '+l,requires:l>1?['hall'+l,'tower'+l,'warehouse'+(l-1)]:['hall1'],description:'Вместимость '+PROGRESSION.warehouseCapacity[l]+' товаров. 2 работника.'+(l>1?' Улучшение: '+(l-1)*140+' монет. Требуется существующая башня не ниже этого уровня.':'')});for(const[type,required]of Object.entries(PROGRESSION.buildingLevels))if(required===l)nodes.push({id:type,level:l,name:TYPES[type].name,requires:['hall'+l],description:TYPES[type].desc});}
for(const type of ['road','house','well','market','farm','fish','lumber','firestation','palisade','gate','tree'])nodes.push({id:type,level:1,name:TYPES[type].name,requires:['hall1'],description:TYPES[type].desc});
const chains=[{id:'grain',name:'Зерно',level:1,requires:['hall1'],description:'Плантация → Зерно → Склад → Рынок → Дом. Работники выращивают и перевозят урожай.'},{id:'fish',name:'Рыба',level:1,requires:['hall1'],description:'Рыба в воде → Рыбацкий домик / лодка → Рыба → Склад → Рынок → Дом. Лодки требуют порт.'},{id:'game',name:'Дичь',level:2,requires:['hunter'],description:'Звери → Охотники → Дичь → Склад → Рынок → Дом. Звери возвращаются через 60 секунд.'},{id:'clay',name:'Глина',level:2,requires:['clay'],description:'Песчаный берег → Глинокопы → Глина → Склад → Гончарная.'},{id:'pots',name:'Посуда',level:2,requires:['pottery'],description:'Глина → Гончарная → Посуда → Склад → Рынок → Дом. Посуда помогает домам расти, используется в торговле.'},{id:'wood',name:'Дерево',level:1,requires:['hall1'],description:'Лес → Лесорубы → Дерево → Склад → Порт → Корабли → Разведка и торговля. Лес отрастает через 120 секунд.'}];let notes={};try{notes=JSON.parse(localStorage.getItem('hearthvale-model-notes')||'{}');}catch{}let selected=null;const board=document.getElementById('board');for(let l=1;l<=4;l++){const col=document.createElement('div');col.className='tier';col.innerHTML='<h2>'+l+' · '+levels[l-1]+'</h2>';for(const node of nodes.filter(n=>n.level===l)){const b=document.createElement('button');b.className='node';b.dataset.node=node.id;b.innerHTML='<b>'+node.name+'</b><small>← '+(node.requires.map(id=>nodes.find(n=>n.id===id)?.name||id).join(' + ')||'Начало')+'</small>';b.onclick=()=>choose(node);col.append(b);}board.append(col);}for(const node of chains){const b=document.createElement('button');b.innerHTML=ResourceUI.icon(node.id)+node.name;b.onclick=()=>choose(node);document.getElementById('goods').append(b);const chain=document.createElement('div');chain.className='chain';chain.textContent=node.description;document.getElementById('chains').append(chain);}ResourceUI.decorate(document.getElementById('chains'));ResourceUI.decorate(board);
function choose(node){selected=node;document.getElementById('title').textContent=node.name;document.getElementById('description').textContent=node.description;ResourceUI.decorate(document.getElementById('description'));const field=document.getElementById('notes');field.disabled=false;field.value=notes[node.id]||'';for(const b of document.querySelectorAll('[data-node]')){b.classList.toggle('active',b.dataset.node===node.id);b.classList.toggle('related',node.requires.includes(b.dataset.node)||nodes.find(n=>n.id===b.dataset.node)?.requires.includes(node.id));}}
document.getElementById('notes').oninput=e=>{if(!selected)return;notes[selected.id]=e.target.value;try{localStorage.setItem('hearthvale-model-notes',JSON.stringify(notes));document.getElementById('notice').textContent='Заметка сохранена в этом браузере.';}catch{document.getElementById('notice').textContent='Не удалось сохранить заметку. Скачай модель, чтобы сохранить её.';}};for(const b of document.querySelectorAll('[data-view]'))b.onclick=()=>{for(const id of ['development','production'])document.getElementById(id).hidden=id!==b.dataset.view;};document.getElementById('export').onclick=()=>{const blob=new Blob([JSON.stringify({version:1,progression:PROGRESSION,nodes,chains,notes},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='hearthvale-model.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
</script></html>
