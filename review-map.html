<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Номерная карта Тиходола</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f3e9;color:#293d32;font:15px system-ui}header{max-width:1600px;margin:auto;padding:20px}h1{font:30px Georgia;margin:16px 0 10px}a{color:#416b53}nav{display:flex;gap:16px;flex-wrap:wrap}#map{display:block;width:100%;max-width:1600px;height:auto;margin:auto;cursor:zoom-in}p{color:#69735f}dialog{background:#f5f3e9;border:0;border-radius:14px;max-width:95vw;padding:20px}dialog::backdrop{background:#233b32a0}dialog canvas{display:block;width:min(480px,80vw);height:auto}button{border:1px solid #dedfd0;background:#fcfbf5;padding:9px 14px;border-radius:8px;color:#293d32;font:inherit;cursor:pointer}</style><header><nav><a href="./">← Игра</a><a href="palette.html">Палитра</a><a href="assets/review-map-v1.png" download="hearthvale-review-map.png">Скачать одним PNG</a><a href="assets/review-map-v1.png" target="_blank">Открыть полный размер</a></nav><h1>Все тайлы и спрайты по номерам</h1><p>Нажми ячейку, чтобы рассмотреть крупнее. Номера закреплены за объектами; можно оценивать графику по ним.</p></header><img id="map" src="assets/review-map-v1.png" alt="Номерная карта всех текущих спрайтов и тайлов Тиходола"><dialog id="detail"><button id="close">Закрыть</button><h2 id="name"></h2><canvas id="zoom" width="480" height="510"></canvas></dialog><script>(async()=>{const data=await fetch('assets/review-map-items.json').then(r=>r.json()),map=document.getElementById('map');map.onclick=e=>{const r=map.getBoundingClientRect(),x=(e.clientX-r.x)/r.width*data.width,y=(e.clientY-r.y)/r.height*data.height,item=data.items.find(i=>x>=i.rect.x&&x<i.rect.x+i.rect.width&&y>=i.rect.y&&y<i.rect.y+i.rect.height);if(!item)return;document.getElementById('name').textContent='№'+item.number+' · '+item.name;const canvas=document.getElementById('zoom'),ctx=canvas.getContext('2d');ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(map,item.rect.x,item.rect.y,item.rect.width,item.rect.height,0,0,480,510);document.getElementById('detail').showModal();};document.getElementById('close').onclick=()=>document.getElementById('detail').close();})();</script></html>
